<!doctype html>
<html lang="el" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOD Newsletter | Ο Κόσμος των Νάνων</title>
  <meta name="description" content="Γίνε μέλος του WOD Newsletter και λάβε νέα για τα βιβλία, αποκλειστικό υλικό και σημαντικές ανακοινώσεις από τον Κόσμο των Νάνων.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#080909">
  <link rel="canonical" href="https://wodstory.com/subscribe.html">
  <link rel="icon" href="assets/images/optimized/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/optimized/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="el_GR">
  <meta property="og:site_name" content="The World of Dwarfs">
  <meta property="og:url" content="https://wodstory.com/subscribe.html">
  <meta property="og:title" content="Μείνε μέσα στην ιστορία | WOD Newsletter">
  <meta property="og:description" content="Νέα βιβλίων, αποκλειστικό υλικό και σημαντικές ανακοινώσεις, απευθείας στο email σου.">
  <meta property="og:image" content="https://wodstory.com/assets/images/optimized/share.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="WOD Newsletter — Ο Κόσμος των Νάνων">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Μείνε μέσα στην ιστορία | WOD Newsletter">
  <meta name="twitter:description" content="Γίνε μέλος του επίσημου newsletter του Κόσμου των Νάνων.">
  <meta name="twitter:image" content="https://wodstory.com/assets/images/optimized/share.jpg">
  <link rel="stylesheet" href="assets/styles/cinzel-english.css?v=1">
  <link rel="stylesheet" href="assets/styles/subscribe.css?v=1">
  <link rel="stylesheet" href="assets/styles/site-scrollbar.css?v=1">
</head>
<body>
  <main class="subscribe-page">
    <section class="subscribe-shell" aria-labelledby="subscribe-title">
      <a class="subscribe-brand" href="/" aria-label="Ο Κόσμος των Νάνων - Αρχική">
        <img src="assets/images/optimized/logo.png" width="680" height="171" alt="Ο Κόσμος των Νάνων">
      </a>

      <div class="subscribe-content">
        <span class="subscribe-kicker">WOD NEWSLETTER</span>
        <h1 id="subscribe-title">Μείνε μέσα<br>στην ιστορία.</h1>
        <p>Λάβε πρώτος νέα για τα βιβλία, αποκλειστικό υλικό από τη δημιουργία του κόσμου και τις σημαντικότερες ανακοινώσεις.</p>

        <form class="subscribe-form" data-newsletter-form data-endpoint="https://app.wodstory.com/api/newsletter/subscribe" novalidate>
          <label class="subscribe-field">
            <span class="sr-only">Email</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17v11h-17zM4 7l8 6 8-6"></path></svg>
            <input name="email" type="email" inputmode="email" autocomplete="email" maxlength="320" placeholder="Το email σου" required>
            <button type="submit"><span>Εγγραφή</span><span aria-hidden="true">→</span></button>
          </label>

          <div class="subscribe-honeypot" aria-hidden="true">
            <label>Website<input name="website" type="text" tabindex="-1" autocomplete="off"></label>
          </div>

          <label class="subscribe-consent">
            <input name="consent" type="checkbox" required>
            <span class="subscribe-check" aria-hidden="true"></span>
            <span>Συμφωνώ να λαμβάνω το WOD Newsletter και αποδέχομαι την <a href="privacy.html">Πολιτική Απορρήτου</a>. Μπορώ να διαγραφώ οποιαδήποτε στιγμή.</span>
          </label>

          <p class="wod-newsletter-status" data-newsletter-status role="status" aria-live="polite"></p>
        </form>

        <div class="subscribe-notes" aria-label="Περιεχόμενο newsletter">
          <span>Νέα βιβλίων</span>
          <span>Αποκλειστικό υλικό</span>
          <span>Σημαντικές ανακοινώσεις</span>
        </div>
      </div>

      <footer class="subscribe-footer">
        <span>© 2026 Ο Κόσμος των Νάνων</span>
        <nav aria-label="Βοηθητικοί σύνδεσμοι"><a href="/">Αρχική</a><a href="privacy.html">Απόρρητο</a></nav>
      </footer>
    </section>
  </main>

  <script src="assets/js/newsletter-signup.js?v=1"></script>
  <script src="assets/js/cinzel-english.js?v=1"></script>
</body>
</html>
